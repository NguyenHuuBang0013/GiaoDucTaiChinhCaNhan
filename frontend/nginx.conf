server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /oauth2/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /login/ { proxy_pass http://backend:8080; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /logout { proxy_pass http://backend:8080; }
}
